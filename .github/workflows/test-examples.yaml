name: test-examples

on:
  workflow_dispatch:
    inputs:
      unikraft_version:
        description: 'Version of the unikraft CLI to install (passed to unikraft/setup-action).'
        required: false
        default: 'latest'

  # Run on any change except docs-only updates. `paths-ignore` keeps the
  # maintenance burden low — we don't need to enumerate every example
  # directory, and the concurrency group below cancels superseded runs
  # so cost stays bounded.
  push:
    branches: [ main ]
    paths-ignore:
    - '**/README.md'
    - '**/*.md'
    - 'LICENSE'

  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ main ]
    paths-ignore:
    - '**/README.md'
    - '**/*.md'
    - 'LICENSE'

  schedule:
  - cron: '0 16 * * 1-5'

permissions:
  contents: read

# Automatically cancel in-progress actions on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  UKC_METRO: ${{ vars.UKC_METRO_STABLE }}
  UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
  UKC_IMAGE_PREFIX: ${{ vars.UKC_IMAGE_PREFIX_STABLE || 'test' }}

jobs:
  pytest:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: requirements.txt

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Unikraft CLI
      uses: unikraft/setup-action@v1
      with:
        version: ${{ inputs.unikraft_version || 'latest' }}

    - name: Authenticate unikraft CLI
      run: echo $UKC_TOKEN | unikraft login --token -

    - name: Detect changed examples
      id: changed
      run: |
        # For scheduled/manual runs, test everything.
        if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          echo "dirs=." >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          BASE=${{ github.event.pull_request.base.sha }}
        else
          BASE=${{ github.event.before }}
        fi

        # Find top-level directories with changes (excluding shared infra).
        CHANGED_DIRS=$(git diff --name-only "$BASE" HEAD | cut -d'/' -f1 | sort -u)

        # If shared test infra changed, run all tests.
        INFRA_PATTERNS="conftest.py|_testlib|pytest.ini|requirements.txt|.github"
        if echo "$CHANGED_DIRS" | grep -qE "^($INFRA_PATTERNS)$"; then
          echo "dirs=." >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Filter to directories that actually contain a test file.
        TARGETS=""
        for dir in $CHANGED_DIRS; do
          if [[ -d "$dir" ]] && find "$dir" -maxdepth 1 -name 'test_*.py' | grep -q .; then
            TARGETS="$TARGETS $dir"
          fi
        done

        if [[ -z "$TARGETS" ]]; then
          echo "No example tests to run for this change."
          echo "dirs=" >> "$GITHUB_OUTPUT"
        else
          echo "dirs=$TARGETS" >> "$GITHUB_OUTPUT"
        fi

    - name: Run tests
      if: steps.changed.outputs.dirs != ''
      run: pytest --log-cli-level=INFO ${{ steps.changed.outputs.dirs }}
